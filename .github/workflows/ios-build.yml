# Сборка iOS-версии AutoDealApp на GitHub Actions.
# Работает в облаке GitHub (macOS-раннер с Xcode) — локальный Mac не нужен.
# Для публичного репозитория macOS-раннеры бесплатны.
#
# Структура монорепо: app/ (мобильное), web/ (веб), admin/ (админка).
#
# Вариант A (включён): сборка БЕЗ подписи — проверка компиляции + артефакт Runner.app.
# Вариант B (закомментирован): подпись + TestFlight — нужен Apple Developer Program ($99/год),
#   секреты репозитория: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API).

name: iOS build

on:
  workflow_dispatch: {} # ручной запуск из вкладки Actions
  # push:
  #   branches: [main]

jobs:
  build-ios:
    runs-on: macos-14 # Apple Silicon, Xcode 15 предустановлен
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.19.6
          channel: stable
          cache: true

      - run: flutter pub get

      # ── Вариант A: без подписи ────────────────────────────────────────────
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package app for artifact
        run: |
          zip -r runner-app.zip build/ios/iphoneos/Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: app/runner-app.zip

