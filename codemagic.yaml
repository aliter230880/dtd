workflows:
  web-release:
    name: DTD Web PWA
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Flutter Web
        script: flutter build web --release
    artifacts:
      - build/web/**

  ios-release:
    name: DTD iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios_signing_files
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.sprestay.autodealapp
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios
          pod install
      - name: Set up signing
        script: |
          echo $CM_DIST_P12_B64 | base64 --decode > /tmp/dist.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_P12_PASS"
          echo $CM_PROFILE_B64 | base64 --decode > /tmp/dtd.mobileprovision
          security cms -D -i /tmp/dtd.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/dtd.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "installed profile $UUID"
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=ios/exportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - aliter230880@gmail.com
        notify:
          success: true
          failure: true
