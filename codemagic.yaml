workflows:
  web-release:
    name: DTD Web PWA
    max_build_duration: 30
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build Flutter Web
        script: flutter build web --release
    artifacts:
      - build/web/**

  android-release:
    name: DTD Android Release
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: app
    environment:
      groups:
        - android_signing
      flutter: stable
    scripts:
      - name: Restore signing files
        script: |
          echo $ANDROID_KEYSTORE_B64 | base64 --decode > android/dtd.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASS
          keyPassword=$ANDROID_KEYSTORE_PASS
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../dtd.jks
          EOF
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - aliter230880@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: DTD iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: app
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - ios_signing_files
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.sprestay.autodealapp
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          cd ios
          pod install
      - name: Set up signing
        script: |
          echo $CM_DIST_P12_B64 | base64 --decode > /tmp/dist.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_P12_PASS"
          echo $CM_PROFILE_B64 | base64 --decode > /tmp/dtd.mobileprovision
          security cms -D -i /tmp/dtd.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/dtd.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "installed profile $UUID"
          xcode-project use-profiles
          # Apple no longer accepts binaries containing legacy bitcode
          # (old Facebook SDK pods ship with it) - strip it everywhere.
          find ios/Pods -name "*.framework" -type d | while read -r fw; do
            name=$(basename "$fw" .framework)
            bin="$fw/$name"
            if [ -f "$bin" ]; then
              xcrun bitcode_strip "$bin" - -o "$bin.strip" && mv "$bin.strip" "$bin"
            fi
          done
          find ios/Pods -name "*.a" -type f | while read -r lib; do
            xcrun bitcode_strip "$lib" - -o "$lib.strip" && mv "$lib.strip" "$lib"
          done
          echo "bitcode stripped"
      - name: Build IPA
        script: |
          flutter build ipa --release --export-options-plist=ios/exportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - aliter230880@gmail.com
        notify:
          success: true
          failure: true
