allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Old plugins (e.g. flutter_keyboard_visibility) predate AGP 8 and do not
// declare a namespace; assign one from the project group so AGP 8 can build them.
subprojects {
    def fixNamespace = { project ->
        if (project.hasProperty("android")) {
            android {
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }
    if (project.state.executed) {
        fixNamespace(project)
    } else {
        project.afterEvaluate { fixNamespace(it) }
    }
}

// flutter_facebook_auth 6.x compiles Kotlin with jvmTarget 17 while Flutter
// defaults Java tasks to 1.8 - align all Kotlin modules to 1.8.
subprojects {
    def fixJvmTarget = { project ->
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
        }
    }
    if (project.state.executed) {
        fixJvmTarget(project)
    } else {
        project.afterEvaluate { fixJvmTarget(it) }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
